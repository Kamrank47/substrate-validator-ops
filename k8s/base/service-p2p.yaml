apiVersion: v1
kind: Service
metadata:
  name: substrate-validator-p2p
  namespace: validator-ops
  labels:
    app.kubernetes.io/name: substrate-validator
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: substrate-validator
  ports:
    - name: p2p
      port: 30333
      targetPort: p2p
      protocol: TCP
