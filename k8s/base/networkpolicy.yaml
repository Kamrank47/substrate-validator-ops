apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: substrate-validator-isolation
  namespace: validator-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: substrate-validator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 30333
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9615
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: partner-services
      ports:
        - protocol: TCP
          port: 9944
