apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: midnight-node
  namespace: midnight-validator
  labels:
    app.kubernetes.io/name: midnight-node
    app.kubernetes.io/part-of: midnight-validator-platform
    slo-tier: "99.99"
spec:
  serviceName: midnight-node-internal
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: midnight-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: midnight-node
        app.kubernetes.io/part-of: midnight-validator-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9615"
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - midnight-node
                topologyKey: kubernetes.io/hostname
      containers:
        - name: midnight-node
          image: midnightntwrk/midnight-node:latest
          imagePullPolicy: IfNotPresent
          args:
            - --validator
            - --base-path=/chain-data
            - --port=30333
            - --rpc-port=9944
            - --rpc-methods=Safe
            - --prometheus-port=9615
            - --prometheus-external
          ports:
            - name: p2p
              containerPort: 30333
              protocol: TCP
            - name: rpc
              containerPort: 9944
              protocol: TCP
            - name: metrics
              containerPort: 9615
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi
          startupProbe:
            tcpSocket:
              port: 9944
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9944
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9615
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: chain-data
              mountPath: /chain-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chain-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 300Gi
