apiVersion: v1
kind: Service
metadata:
  name: midnight-node-internal
  namespace: midnight-validator
  labels:
    app.kubernetes.io/name: midnight-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: midnight-node
  ports:
    - name: rpc
      port: 9944
      targetPort: rpc
      protocol: TCP
    - name: metrics
      port: 9615
      targetPort: metrics
      protocol: TCP
