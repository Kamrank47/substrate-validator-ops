apiVersion: v1
kind: Service
metadata:
  name: substrate-validator-internal
  namespace: validator-ops
  labels:
    app.kubernetes.io/name: substrate-validator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: substrate-validator
  ports:
    - name: rpc
      port: 9944
      targetPort: rpc
      protocol: TCP
    - name: metrics
      port: 9615
      targetPort: metrics
      protocol: TCP
