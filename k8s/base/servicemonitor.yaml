apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: substrate-validator-metrics
  namespace: validator-ops
  labels:
    app.kubernetes.io/name: substrate-validator
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-validator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
