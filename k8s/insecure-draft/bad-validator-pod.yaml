# Deliberately insecure Kubernetes fixture used to prove policy/k8s_validator.rego catches:
# 1) Deployment instead of StatefulSet for validator identity/storage
# 2) Missing non-root & readOnlyRootFilesystem & allowPrivilegeEscalation=false
# 3) Missing readinessProbe and livenessProbe
# 4) Public LoadBalancer exposing RPC port 9944 and Prometheus port 9615
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-validator-unsafe
  namespace: validator-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: substrate-validator-unsafe
  template:
    metadata:
      labels:
        app: substrate-validator-unsafe
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: substrate-validator
          image: parity/substrate:latest
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 9944
---
apiVersion: v1
kind: Service
metadata:
  name: substrate-validator-public-rpc
  namespace: validator-ops
spec:
  type: LoadBalancer
  selector:
    app: substrate-validator-unsafe
  ports:
    - name: rpc
      port: 9944
      targetPort: 9944
    - name: metrics
      port: 9615
      targetPort: 9615
