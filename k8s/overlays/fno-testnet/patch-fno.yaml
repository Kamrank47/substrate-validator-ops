apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: substrate-validator
  namespace: validator-ops
spec:
  template:
    metadata:
      labels:
        validator.ops/operator: fno
    spec:
      containers:
        - name: substrate-validator
          args:
            - --validator
            - --chain=testnet
            - --base-path=/chain-data
            - --port=30333
            - --rpc-port=9944
            - --rpc-methods=Safe
            - --prometheus-port=9615
            - --prometheus-external
