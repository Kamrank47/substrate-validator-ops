services:
  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:10.1.4
    container_name: cardano-partner-follower
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "run"
      - "--topology=/config/topology.json"
      - "--database-path=/cardano-db"
      - "--socket-path=/ipc/node.socket"
    volumes:
      - /var/lib/cardano/db:/cardano-db
      - /var/run/cardano-ipc:/ipc
      - /etc/cardano/config:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/node.socket"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  substrate-validator:
    image: parity/substrate:latest
    container_name: substrate-spo-validator
    depends_on:
      cardano-node:
        condition: service_healthy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - CARDANO_SECURITY_PARAMETER=2160
      - CARDANO_NODE_SOCKET_PATH=/ipc/node.socket
    ports:
      - "30333:30333/tcp"
      - "127.0.0.1:9944:9944/tcp"
      - "127.0.0.1:9615:9615/tcp"
    command:
      - "--validator"
      - "--chain=mainnet"
      - "--base-path=/chain-data"
      - "--port=30333"
      - "--rpc-port=9944"
      - "--rpc-methods=Safe"
      - "--prometheus-port=9615"
      - "--prometheus-external"
    volumes:
      - /var/lib/validator/chain-data:/chain-data
      - /var/run/cardano-ipc:/ipc:ro
      - /etc/validator/keystore:/keystore:ro
    tmpfs:
      - /tmp

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: validator-spo-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=127.0.0.1:9100"
    volumes:
      - /:/host:ro,rslave
